
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy the app
        shell: powershell
        run: |
          function Run($c) {
              Write-Host "Executing: $c"
              Invoke-Expression $c

              if ($LASTEXITCODE -ne 0) {
                  throw "FAILED: $c"
              }
          }

          cd C:\nginx\www\inventory-system-prototype.apps

          try {
              Run "php artisan down --render='errors::503'"

              # Match origin/main exactly; manual edits to tracked files on the server are discarded.
              Run "git fetch origin main"

              Run "git reset --hard origin/main"

              Run "composer install --optimize-autoloader"

              Run "npm ci"

              Run "npm run build"

              Run "php artisan migrate:fresh --seed"

              Run "php artisan optimize:clear"

              Run "php artisan optimize"

              # Workers keep the old code in memory; they exit after their current job.
              Run "php artisan queue:restart"
          }
          finally {
              Write-Host "Bringing application back online..."
              php artisan up
          }
